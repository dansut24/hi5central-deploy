name: Stripe Test Gateway Preflight

on:
  pull_request:
    paths:
      - 'scripts/prepare-stripe-test-gateway-candidate.sh'
      - 'compose.yml'
      - '.github/workflows/stripe-test-gateway-preflight.yml'
      - 'docs/operations/stripe-sandbox-webhook-gateway.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n scripts/prepare-stripe-test-gateway-candidate.sh
      - name: Test exact-path routing preservation and fail-closed guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stripe-gateway
          cat > /tmp/stripe-gateway/active <<'CADDY'
          {
            email admin@example.invalid
          }
          http://test-api.hi5central.com {
            reverse_proxy control-server:3001
          }
          http://test.hi5central.com {
            reverse_proxy itsm-web:80
          }
          http://testing-test.hi5central.com {
              # Preserve the existing pilot's original routes
              @testReleaseApi path /api/v1/* /api/*
              handle @testReleaseApi {
                  reverse_proxy hi5pool-test-unified-acd8e2c2-api:3001
              }
              handle {
                  reverse_proxy hi5pool-test-unified-acd8e2c2-web:80
              }
          }
          CADDY
          export HI5_STRIPE_TEST_GATEWAY_PREFLIGHT=render-only
          export RUNTIME_ENVIRONMENT=test
          export COMPOSE_PROJECT_NAME=hi5central-test
          sh scripts/prepare-stripe-test-gateway-candidate.sh /tmp/stripe-gateway/active /tmp/stripe-gateway/candidate
          awk '
            $0 == "    # HI5_STRIPE_SANDBOX_PILOT_START" { skip=1; next }
            $0 == "    # HI5_STRIPE_SANDBOX_PILOT_END" { skip=0; next }
            !skip { print }
          ' /tmp/stripe-gateway/candidate > /tmp/stripe-gateway/restored
          cmp /tmp/stripe-gateway/active /tmp/stripe-gateway/restored
          grep -Fq 'method POST' /tmp/stripe-gateway/candidate
          grep -Fq 'path /api/platform/v1/billing/stripe/webhook' /tmp/stripe-gateway/candidate
          if sh scripts/prepare-stripe-test-gateway-candidate.sh /tmp/stripe-gateway/active /tmp/stripe-gateway/candidate; then
            echo 'FAIL: overwrote existing output'; exit 1
          fi
          cp /tmp/stripe-gateway/active /tmp/stripe-gateway/unchanged
          if RUNTIME_ENVIRONMENT=live sh scripts/prepare-stripe-test-gateway-candidate.sh /tmp/stripe-gateway/active /tmp/stripe-gateway/forbidden; then
            echo 'FAIL: live env allowed'; exit 1
          fi
          if COMPOSE_PROJECT_NAME=hi5central-prod sh scripts/prepare-stripe-test-gateway-candidate.sh /tmp/stripe-gateway/active /tmp/stripe-gateway/forbidden; then
            echo 'FAIL: prod project allowed'; exit 1
          fi
          if HI5_STRIPE_TEST_GATEWAY_PREFLIGHT=off sh scripts/prepare-stripe-test-gateway-candidate.sh /tmp/stripe-gateway/active /tmp/stripe-gateway/forbidden; then
            echo 'FAIL: missing explicit guard allowed'; exit 1
          fi
          sed 's/hi5pool-test-unified-acd8e2c2-api:3001/unknown-api:3001/' /tmp/stripe-gateway/active > /tmp/stripe-gateway/drifted
          if sh scripts/prepare-stripe-test-gateway-candidate.sh /tmp/stripe-gateway/drifted /tmp/stripe-gateway/forbidden; then
            echo 'FAIL: API upstream drift allowed'; exit 1
          fi
          cp /tmp/stripe-gateway/candidate /tmp/stripe-gateway/has-stripe
          if sh scripts/prepare-stripe-test-gateway-candidate.sh /tmp/stripe-gateway/has-stripe /tmp/stripe-gateway/forbidden; then
            echo 'FAIL: duplicate Stripe route allowed'; exit 1
          fi
          cmp /tmp/stripe-gateway/active /tmp/stripe-gateway/unchanged
          test ! -e /tmp/stripe-gateway/forbidden
      - name: Offline validate output using Caddy
        run: |
          docker run --rm -i --entrypoint caddy caddy:2-alpine \
            validate --config /dev/stdin --adapter caddyfile \
            < /tmp/stripe-gateway/candidate
      - name: Exercise actual Compose config-init Test baseline, webhook and rollback
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=hi5central-test RUNTIME_ENVIRONMENT=test
          export POSTGRES_PASSWORD=ci_not_real REDIS_PASSWORD=ci_not_real
          export TURN_SHARED_SECRET=ci_synthetic_secret
          export MFA_ENCRYPTION_KEY=ci_synthetic_key
          export RMM_RECOVERY_KEY_ENCRYPTION_KEY=ci_synthetic_key
          export CONNECT_CODE_HMAC_KEY=ci_synthetic_key
          export API_ADDRESS=http://test-api.hi5central.com
          export ITSM_ADDRESS=http://test.hi5central.com
          export RMM_ADDRESS=http://test-rmm.hi5central.com
          export ADMIN_ADDRESS=http://test-admin.hi5central.com
          export DOWNLOADS_ADDRESS=http://test-downloads.hi5central.com
          export ACME_EMAIL=admin@hi5central.com
          export STRIPE_TEST_GATEWAY_ROUTING_MODE=baseline

          # The script is taken from Docker Compose's fully interpolated configuration,
          # not by guessing how YAML, heredocs, and $$ shell escapes are processed.
          docker compose -f compose.yml config --format json > /tmp/stripe-ci-compose.json
          python3 - <<'PY'
          import json, pathlib
          obj=json.loads(pathlib.Path('/tmp/stripe-ci-compose.json').read_text())
          command=obj['services']['config-init']['command']
          assert isinstance(command,list) and command[:2]==['/bin/sh','-ec'],command[:2]
          script=command[2].replace('$', '          assert '$STRIPE_TEST_GATEWAY_ROUTING_MODE' in script
          assert '$COMPOSE_PROJECT_NAME' in script
          assert '$RUNTIME_ENVIRONMENT' in script
          pathlib.Path('/tmp/stripe-ci-config-init.sh').write_text(script)
          PY
          sh -n /tmp/stripe-ci-config-init.sh

          for mode in baseline webhook; do
            docker run --rm --network none -i \
              -e TURN_SHARED_SECRET=ci_synthetic_secret \
              -e TURN_REALM=hi5central -e ACME_EMAIL=admin@hi5central.com \
              -e API_ADDRESS=http://test-api.hi5central.com \
              -e ITSM_ADDRESS=http://test.hi5central.com \
              -e RMM_ADDRESS=http://test-rmm.hi5central.com \
              -e ADMIN_ADDRESS=http://test-admin.hi5central.com \
              -e DOWNLOADS_ADDRESS=http://test-downloads.hi5central.com \
              -e HELP_ADDRESS= -e RELEASE_TEST_ADDRESSES= -e RELEASE_UAT_ADDRESSES= \
              -e COMPOSE_PROJECT_NAME=hi5central-test -e RUNTIME_ENVIRONMENT=test \
              -e STRIPE_TEST_GATEWAY_ROUTING_MODE="$mode" \
              alpine:3.22 sh -ec \
                'mkdir /gateway-config /turn-config /run-secrets; sh /dev/stdin; cat /gateway-config/Caddyfile' \
              < /tmp/stripe-ci-config-init.sh > "/tmp/stripe-ci-$mode.Caddyfile"
            docker run --rm -i --entrypoint caddy caddy:2-alpine \
              validate --config /dev/stdin --adapter caddyfile < "/tmp/stripe-ci-$mode.Caddyfile"
          done

          # The hash is from the effective read-only Test Caddyfile and its
          # separately captured original VPS backup on 2026-10-13.
          printf '%s  %s\n' \
            69d7154bf19e3fcad0d36fe9e4eb91bc52a52bd5d96388d89cfe45cdf31d0882 \
            /tmp/stripe-ci-baseline.Caddyfile | sha256sum -c -

          # Rollback proof: removing only the Stripe section exactly reproduces
          # the approved baseline, including all other pinned Test pilot routes.
          awk '
            /^    # HI5_STRIPE_SANDBOX_PILOT_START$/ { skip=1; next }
            /^    # HI5_STRIPE_SANDBOX_PILOT_END$/ { skip=0; next }
            !skip { print }
          ' /tmp/stripe-ci-webhook.Caddyfile > /tmp/stripe-ci-rollback.Caddyfile
          cmp /tmp/stripe-ci-baseline.Caddyfile /tmp/stripe-ci-rollback.Caddyfile
          grep -Fq 'method POST' /tmp/stripe-ci-webhook.Caddyfile
          grep -Fq 'path /api/platform/v1/billing/stripe/webhook' /tmp/stripe-ci-webhook.Caddyfile
          test "$(grep -Fc 'reverse_proxy stripeqa-api:3001' /tmp/stripe-ci-webhook.Caddyfile)" -eq 1

          # Wrong env must exit BEFORE touching even a pre-existing config.
          if docker run --rm --network none -i \
              -e STRIPE_TEST_GATEWAY_ROUTING_MODE=webhook \
              -e COMPOSE_PROJECT_NAME=hi5central-test -e RUNTIME_ENVIRONMENT=live \
              alpine:3.22 sh -ec \
                'mkdir /gateway-config /turn-config /run-secrets; printf "PRESERVE\\n" > /gateway-config/Caddyfile; if sh /dev/stdin; then exit 88; fi; grep -qx PRESERVE /gateway-config/Caddyfile' \
              < /tmp/stripe-ci-config-init.sh; then
            echo 'Live runtime guard confirmed: no config changed.'
          else
            echo 'FAIL: fail-closed guard damaged Caddy config'; exit 1
          fi
)
          assert '$STRIPE_TEST_GATEWAY_ROUTING_MODE' in script
          assert '$COMPOSE_PROJECT_NAME' in script
          assert '$RUNTIME_ENVIRONMENT' in script
          pathlib.Path('/tmp/stripe-ci-config-init.sh').write_text(script)
          PY
          sh -n /tmp/stripe-ci-config-init.sh

          for mode in baseline webhook; do
            docker run --rm --network none -i \
              -e TURN_SHARED_SECRET=ci_synthetic_secret \
              -e TURN_REALM=hi5central -e ACME_EMAIL=admin@hi5central.com \
              -e API_ADDRESS=http://test-api.hi5central.com \
              -e ITSM_ADDRESS=http://test.hi5central.com \
              -e RMM_ADDRESS=http://test-rmm.hi5central.com \
              -e ADMIN_ADDRESS=http://test-admin.hi5central.com \
              -e DOWNLOADS_ADDRESS=http://test-downloads.hi5central.com \
              -e HELP_ADDRESS= -e RELEASE_TEST_ADDRESSES= -e RELEASE_UAT_ADDRESSES= \
              -e COMPOSE_PROJECT_NAME=hi5central-test -e RUNTIME_ENVIRONMENT=test \
              -e STRIPE_TEST_GATEWAY_ROUTING_MODE="$mode" \
              alpine:3.22 sh -ec \
                'mkdir /gateway-config /turn-config /run-secrets; sh /dev/stdin; cat /gateway-config/Caddyfile' \
              < /tmp/stripe-ci-config-init.sh > "/tmp/stripe-ci-$mode.Caddyfile"
            docker run --rm -i --entrypoint caddy caddy:2-alpine \
              validate --config /dev/stdin --adapter caddyfile < "/tmp/stripe-ci-$mode.Caddyfile"
          done

          # The hash is from the effective read-only Test Caddyfile and its
          # separately captured original VPS backup on 2026-10-13.
          printf '%s  %s\n' \
            69d7154bf19e3fcad0d36fe9e4eb91bc52a52bd5d96388d89cfe45cdf31d0882 \
            /tmp/stripe-ci-baseline.Caddyfile | sha256sum -c -

          # Rollback proof: removing only the Stripe section exactly reproduces
          # the approved baseline, including all other pinned Test pilot routes.
          awk '
            /^    # HI5_STRIPE_SANDBOX_PILOT_START$/ { skip=1; next }
            /^    # HI5_STRIPE_SANDBOX_PILOT_END$/ { skip=0; next }
            !skip { print }
          ' /tmp/stripe-ci-webhook.Caddyfile > /tmp/stripe-ci-rollback.Caddyfile
          cmp /tmp/stripe-ci-baseline.Caddyfile /tmp/stripe-ci-rollback.Caddyfile
          grep -Fq 'method POST' /tmp/stripe-ci-webhook.Caddyfile
          grep -Fq 'path /api/platform/v1/billing/stripe/webhook' /tmp/stripe-ci-webhook.Caddyfile
          test "$(grep -Fc 'reverse_proxy stripeqa-api:3001' /tmp/stripe-ci-webhook.Caddyfile)" -eq 1

          # Wrong env must exit BEFORE touching even a pre-existing config.
          if docker run --rm --network none -i \
              -e STRIPE_TEST_GATEWAY_ROUTING_MODE=webhook \
              -e COMPOSE_PROJECT_NAME=hi5central-test -e RUNTIME_ENVIRONMENT=live \
              alpine:3.22 sh -ec \
                'mkdir /gateway-config /turn-config /run-secrets; printf "PRESERVE\\n" > /gateway-config/Caddyfile; if sh /dev/stdin; then exit 88; fi; grep -qx PRESERVE /gateway-config/Caddyfile' \
              < /tmp/stripe-ci-config-init.sh; then
            echo 'Live runtime guard confirmed: no config changed.'
          else
            echo 'FAIL: fail-closed guard damaged Caddy config'; exit 1
          fi
