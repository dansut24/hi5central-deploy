name: Validate Deployment

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment shell syntax
        run: sh -n install.sh scripts/*.sh
      - name: Check managed single-command entrypoint syntax and fail closed
        run: |
          bash -n install-managed.sh
          set +e
          bash install-managed.sh --install --admin-email owner@example.invalid > /tmp/h5-install-safety-output 2>&1
          code=$?
          set -e
          test "$code" -eq 3
          grep -Fq 'NOT READY' /tmp/h5-install-safety-output
          grep -Fq 'No changes performed' /tmp/h5-install-safety-output
          rm /tmp/h5-install-safety-output
      - name: Validate managed clean-rebuild safety tools
        run: |
          python3 -m py_compile scripts/managed-isolated-rehearsal-cleanup.py scripts/export-global-software-catalogue.py scripts/verify-global-software-catalogue.py scripts/prepare-managed-secrets.py scripts/import-global-software-catalogue.py scripts/configure-managed-db-editor.py
          bash -n scripts/managed-prewipe-inventory.sh scripts/managed-qualification-and-disposable-audit.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/export-global-software-catalogue.py').read_text()
          assert "WHERE c.tenant_id IS NULL" in p
          for table in ('rmm_software_catalogue','rmm_software_vendor_sources',
                        'rmm_software_vendor_bindings','rmm_software_vendor_releases'):
              assert table in p
          assert "os.replace(pending,final)" in p
          print('PASS: global software catalogue exporter is allowlisted and atomic')
          PY
          python3 -m unittest discover -s tests -p test_global_software_seed.py -v
          python3 -m unittest discover -s tests -p test_managed_secret_preparation.py -v
      - name: Validate fresh PostgreSQL catalogue restore and private editor permissions
        run: |
          bash -n tests/smoke_managed_seed_postgres.sh
          bash tests/smoke_managed_seed_postgres.sh
      - name: Verify private pgAdmin full-edit browser overlay
        env:
          HI5_PGADMIN_IMAGE: dpage/pgadmin4:ci-config-only
          HI5_PGADMIN_EMAIL: administrator@example.invalid
          HI5_PGADMIN_PASSWORD_FILE: /tmp/pgadmin-ci-password
          HI5_PGADMIN_LOCAL_PORT: '5050'
        run: |
          umask 077
          printf 'ci-not-used-for-login\n' > /tmp/pgadmin-ci-password
          docker compose -f compose.yml -f compose.pgadmin-private.yml --env-file environments/prod.env.example --profile database-browser config --format json > /tmp/pgadmin-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/pgadmin-compose.json') as f: config=json.load(f)
          service=config['services']['pgadmin']
          ports=service['ports']
          assert len(ports)==1
          assert ports[0]['host_ip']=='127.0.0.1',ports
          assert ports[0]['published']=='5050' or ports[0]['published']==5050
          assert ports[0]['target']==80
          assert 'hi5internal' in service['networks']
          assert 'pgadmin_password' in config['secrets']
          print('PASS: pgAdmin is private-loopback only and separately authenticated')
          PY
          rm /tmp/pgadmin-compose.json /tmp/pgadmin-ci-password
      - name: Validate Standard self-host bootstrap
        env:
          HI5_ROOT_DOMAIN: ci.localhost
          HI5_EDITION: standard
          HI5_PRODUCTS: itsm,rmm
          HI5_SCHEME: http
          HI5_SKIP_PREFLIGHT: '1'
        run: |
          ./install.sh --http --configure-only --force
          ! docker compose config --services | grep -qx admin-web
          ! docker compose config --services | grep -qx docs-web
      - name: Validate MSP self-host bootstrap
        env:
          HI5_ROOT_DOMAIN: ci.localhost
          HI5_EDITION: msp
          HI5_PRODUCTS: itsm,rmm
          HI5_SCHEME: http
          HI5_SKIP_PREFLIGHT: '1'
        run: |
          ./install.sh --http --configure-only --force
          docker compose config --services | grep -qx admin-web
          ! docker compose config --services | grep -qx docs-web
      - name: Validate managed Dev, Test, UAT and Live profiles
        run: |
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/dev.env.example config --services | grep -qx docs-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/test.env.example config --services | grep -qx admin-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/uat.env.example config --services | grep -qx admin-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/prod.env.example config --services | grep -qx docs-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/dev.env.example config | grep -q 'RUNTIME_ENVIRONMENT: dev'
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/test.env.example config | grep -q 'RUNTIME_ENVIRONMENT: test'
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/uat.env.example config | grep -q 'RUNTIME_ENVIRONMENT: uat'
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/prod.env.example config | grep -q 'RUNTIME_ENVIRONMENT: live'