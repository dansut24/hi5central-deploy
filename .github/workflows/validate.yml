name: Validate Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check installer shell syntax
        run: sh -n install.sh scripts/*.sh
      - name: Validate one-run bootstrap configuration
        env:
          HI5_ROOT_DOMAIN: ci.localhost
          HI5_PRODUCTS: itsm,rmm,admin
          HI5_SCHEME: http
        run: ./install.sh --http --configure-only --force
      - name: Show enabled services
        run: docker compose config --services