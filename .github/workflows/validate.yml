name: Validate Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: |
          cp .env.example .env
          PG_PASSWORD=$(openssl rand -hex 18)
          REDIS_PASSWORD=$(openssl rand -hex 18)
          MFA_KEY=$(openssl rand -hex 32)
          RMM_KEY=$(openssl rand -hex 32)
          TURN_SECRET=$(openssl rand -hex 32)
          sed -i "s/POSTGRES_PASSWORD=CHANGE_ME/POSTGRES_PASSWORD=$PG_PASSWORD/" .env
          sed -i "s/REDIS_PASSWORD=CHANGE_ME/REDIS_PASSWORD=$REDIS_PASSWORD/" .env
          sed -i "s/MFA_ENCRYPTION_KEY=64_HEX_CHARACTERS/MFA_ENCRYPTION_KEY=$MFA_KEY/" .env
          sed -i "s/RMM_RECOVERY_KEY_ENCRYPTION_KEY=64_HEX_CHARACTERS/RMM_RECOVERY_KEY_ENCRYPTION_KEY=$RMM_KEY/" .env
          mkdir -p secrets
          printf '%s' "$TURN_SECRET" > secrets/turn_shared_secret
          cat > secrets/turnserver.conf <<TURN
          listening-port=3478
          fingerprint
          use-auth-secret
          static-auth-secret=$TURN_SECRET
          realm=example.internal
          min-port=49160
          max-port=49200
          TURN
      - name: Validate Compose
        run: ./scripts/validate.sh
      - name: Show enabled services
        run: docker compose config --services
