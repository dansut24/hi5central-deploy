name: Validate Deployment

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment shell syntax
        run: sh -n install.sh scripts/*.sh
      - name: Validate Standard self-host bootstrap
        env:
          HI5_ROOT_DOMAIN: ci.localhost
          HI5_EDITION: standard
          HI5_PRODUCTS: itsm,rmm
          HI5_SCHEME: http
          HI5_SKIP_PREFLIGHT: '1'
        run: |
          ./install.sh --http --configure-only --force
          ! docker compose config --services | grep -qx admin-web
          ! docker compose config --services | grep -qx docs-web
      - name: Validate MSP self-host bootstrap
        env:
          HI5_ROOT_DOMAIN: ci.localhost
          HI5_EDITION: msp
          HI5_PRODUCTS: itsm,rmm
          HI5_SCHEME: http
          HI5_SKIP_PREFLIGHT: '1'
        run: |
          ./install.sh --http --configure-only --force
          docker compose config --services | grep -qx admin-web
          ! docker compose config --services | grep -qx docs-web
      - name: Validate managed Dev, Test, UAT and Live profiles
        run: |
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/dev.env.example config --services | grep -qx docs-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/test.env.example config --services | grep -qx admin-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/uat.env.example config --services | grep -qx admin-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/prod.env.example config --services | grep -qx docs-web
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/dev.env.example config | grep -q 'RUNTIME_ENVIRONMENT: dev'
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/test.env.example config | grep -q 'RUNTIME_ENVIRONMENT: test'
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/uat.env.example config | grep -q 'RUNTIME_ENVIRONMENT: uat'
          docker compose -f compose.yml -f compose.managed-edge.yml --env-file environments/prod.env.example config | grep -q 'RUNTIME_ENVIRONMENT: live'