services:
  marketing-pages:
    image: python:3.13-alpine
    container_name: hi5central-marketing-pages
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    command: ["python", "-u", "/app/server.py"]
    environment:
      MARKETING_CONTACT_DB: /data/contact.sqlite3
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./app:/app:ro
      - ./data:/data:rw
    expose:
      - "8080"
    networks:
      - hi5central-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
networks:
  hi5central-internal:
    external: true
